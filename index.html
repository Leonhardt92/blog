<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Docs</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://unpkg.com/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    :root {
      --theme-color: #1677ff;
    }

    .app-name-link img {
      max-width: 120px;
    }

    .sidebar-nav li > p,
    .sidebar-nav li > a {
      word-break: break-word;
    }

    .markdown-section {
      max-width: 960px;
    }

    .docsify-copy-code-button,
    .closeBtn {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>

  <script>
    (function () {
      // 兼容：
      // 1. 本地 http://localhost:8080/
      // 2. GitHub Pages 项目页 https://user.github.io/repo/
      // 3. GitHub Pages 用户页 https://user.github.io/
      var siteBase = location.pathname.replace(/[^/]*$/, '');
      if (!siteBase.endsWith('/')) siteBase += '/';
      var docsBase = siteBase + 'docs/';

      window.$docsify = {
        name: 'My Blog',
        repo: '',
        basePath: docsBase,
        homepage: 'README.md',
        loadSidebar: true,
        alias: {
          '/.*/_sidebar.md': docsBase + '_sidebar.md'
        },
        subMaxLevel: 2,
        sidebarDisplayLevel: 1,
        auto2top: true,
        routerMode: 'hash',
        relativePath: false,
        search: {
          paths: 'auto',
          placeholder: '搜索',
          noData: '没有结果',
          depth: 6
        }
      };

      if (location.protocol === 'file:') {
        document.getElementById('app').innerHTML = [
          '<div style="max-width:760px;margin:48px auto;padding:24px;border:1px solid #e5e7eb;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif;line-height:1.7;">',
          '<h2 style="margin-top:0;">不能直接双击打开 index.html</h2>',
          '<p>Docsify 会通过 HTTP 请求读取 <code>docs/</code> 里的 Markdown。请在项目根目录启动一个本地静态服务器，再访问页面。</p>',
          '<pre style="background:#f6f8fa;padding:12px;border-radius:8px;overflow:auto;">python3 -m http.server 8080</pre>',
          '<p>然后打开：<code>http://localhost:8080/</code></p>',
          '</div>'
        ].join('');
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://unpkg.com/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
